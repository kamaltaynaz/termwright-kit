<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The eight prompts, in order</title>
<desc id="d">Eight steps in order: ground rules, discovery, spec, build, test, review, rollout and operate. You approve the result of each step before the agent moves to the next.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<line x1="221" y1="85.0" x2="239" y2="85.0" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<line x1="451" y1="85.0" x2="469" y2="85.0" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<line x1="681" y1="85.0" x2="699" y2="85.0" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<line x1="221" y1="245.0" x2="239" y2="245.0" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<line x1="451" y1="245.0" x2="469" y2="245.0" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<line x1="681" y1="245.0" x2="699" y2="245.0" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<path d="M805.0 153 V165 H115.0 V176" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
<rect x="12" y="20" width="206" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="38" cy="48" r="12" fill="#0969da"/>
<text x="38" y="52.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">0</text>
<text x="60" y="53.5" font-size="16" font-weight="700" fill="#1f2328">Ground rules</text>
<text x="28" y="81" font-size="13" fill="#1f2328">The agent loads the rules</text>
<text x="28" y="99" font-size="13" fill="#1f2328">for the whole build</text>
<text x="28" y="130" font-size="12.5" fill="#1a7f37" font-weight="600">You approve: the rules</text>
<rect x="242" y="20" width="206" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="268" cy="48" r="12" fill="#0969da"/>
<text x="268" y="52.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
<text x="290" y="53.5" font-size="16" font-weight="700" fill="#1f2328">Discovery</text>
<text x="258" y="81" font-size="13" fill="#1f2328">The agent interviews you</text>
<text x="258" y="99" font-size="13" fill="#1f2328">about your Canvas</text>
<text x="258" y="130" font-size="12.5" fill="#1a7f37" font-weight="600">You approve: your answers</text>
<rect x="472" y="20" width="206" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="498" cy="48" r="12" fill="#0969da"/>
<text x="498" y="52.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
<text x="520" y="53.5" font-size="16" font-weight="700" fill="#1f2328">Spec</text>
<text x="488" y="81" font-size="13" fill="#1f2328">Your answers become</text>
<text x="488" y="99" font-size="13" fill="#1f2328">a written specification</text>
<text x="488" y="130" font-size="12.5" fill="#1a7f37" font-weight="600">You approve: the spec</text>
<rect x="702" y="20" width="206" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="728" cy="48" r="12" fill="#0969da"/>
<text x="728" y="52.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
<text x="750" y="53.5" font-size="16" font-weight="700" fill="#1f2328">Build</text>
<text x="718" y="81" font-size="13" fill="#1f2328">Small steps, each one</text>
<text x="718" y="99" font-size="13" fill="#1f2328">tested before the next</text>
<text x="718" y="130" font-size="12.5" fill="#1a7f37" font-weight="600">You approve: each milestone</text>
<rect x="12" y="180" width="206" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="38" cy="208" r="12" fill="#0969da"/>
<text x="38" y="212.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
<text x="60" y="213.5" font-size="16" font-weight="700" fill="#1f2328">Test</text>
<text x="28" y="241" font-size="13" fill="#1f2328">Four levels, ending in</text>
<text x="28" y="259" font-size="13" fill="#1f2328">your test environment</text>
<text x="28" y="290" font-size="12.5" fill="#1a7f37" font-weight="600">You approve: the test report</text>
<rect x="242" y="180" width="206" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="268" cy="208" r="12" fill="#0969da"/>
<text x="268" y="212.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
<text x="290" y="213.5" font-size="16" font-weight="700" fill="#1f2328">Review</text>
<text x="258" y="241" font-size="13" fill="#1f2328">A second agent or person</text>
<text x="258" y="259" font-size="13" fill="#1f2328">checks the work</text>
<text x="258" y="290" font-size="12.5" fill="#1a7f37" font-weight="600">You approve: each round's fixes</text>
<rect x="472" y="180" width="206" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="498" cy="208" r="12" fill="#0969da"/>
<text x="498" y="212.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text>
<text x="520" y="213.5" font-size="16" font-weight="700" fill="#1f2328">Rollout</text>
<text x="488" y="241" font-size="13" fill="#1f2328">Read-only, dry run, one</text>
<text x="488" y="259" font-size="13" fill="#1f2328">small piece, then the rest</text>
<text x="488" y="290" font-size="12.5" fill="#1a7f37" font-weight="600">You approve: every step</text>
<rect x="702" y="180" width="206" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="728" cy="208" r="12" fill="#0969da"/>
<text x="728" y="212.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">7</text>
<text x="750" y="213.5" font-size="16" font-weight="700" fill="#1f2328">Operate</text>
<text x="718" y="241" font-size="13" fill="#1f2328">Scheduling, alerts and</text>
<text x="718" y="259" font-size="13" fill="#1f2328">a heartbeat</text>
<text x="718" y="290" font-size="12.5" fill="#1a7f37" font-weight="600">You approve: the runbook</text>
</svg>
